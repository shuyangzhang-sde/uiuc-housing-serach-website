name: Refresh listings

on:
  schedule:
    # Scheduled daily at 6 AM Chicago time, including DST changes.
    # Run even if GitHub starts the job later than the scheduled time.
    - cron: "0 6 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: "Allow a source count drop over 50% after manual review"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 playwright python-dotenv fastapi==0.136.3 PyJWT==2.9.0 cryptography==46.0.5 httpx
          python -m playwright install --with-deps chromium

      - name: Test refresh safeguards
        run: python -m unittest discover -s tests -v

      - name: Scrape, validate, and prepare a complete refresh
        env:
          REFRESH_RUN_ID: "${{ github.run_id }}.${{ github.run_attempt }}"
          ALLOW_LARGE_DROP: "${{ inputs.allow_large_drop }}"
        run: |
          set -euo pipefail
          args=()
          if [ "$ALLOW_LARGE_DROP" = "true" ]; then
            args+=(--allow-large-drop)
          fi
          python -m pipeline.refresh "${args[@]}"

      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first so new snapshots/receipts are included in the diff check.
          git add -A data snapshots
          if git diff --cached --quiet; then
            echo "Expected a new successful-check receipt, but nothing was staged."
            exit 1
          fi
          git commit -m "data: refresh listings $(date -u +%F)"
          git push

      - name: Verify that production serves this refresh
        env:
          REFRESH_STATUS_URL: "${{ vars.REFRESH_STATUS_URL }}"
        run: python scripts/refresh_ops.py verify --timeout 900

      - name: Check in with external freshness monitor
        env:
          REFRESH_HEARTBEAT_URL: "${{ secrets.REFRESH_HEARTBEAT_URL }}"
        run: python scripts/refresh_ops.py heartbeat

      - name: Save refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "refresh-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}"
          path: tmp/refresh/
          if-no-files-found: warn
          retention-days: 14

  notify-failure:
    needs: refresh
    if: ${{ always() && needs.refresh.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve diagnostics if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: "refresh-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}"
          path: tmp/refresh/
      - name: Email the operator
        env:
          RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"
          REFRESH_ALERT_TO: "${{ secrets.REFRESH_ALERT_TO }}"
          RESEND_FROM_ADDRESS: "${{ vars.RESEND_FROM_ADDRESS }}"
        run: python3 scripts/refresh_ops.py failure
